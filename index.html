<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal ❤️</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #ff9a9e, #fecfef); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 350px; }
        h1 { color: #d63384; font-size: 22px; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 20px; }
        
        .btn-container { display: flex; justify-content: center; gap: 15px; min-height: 50px; align-items: center; }
        button { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        
        .yes-btn { background-color: #4CAF50; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .no-btn { background-color: #f44336; color: white; position: relative; }
        
        .hidden { display: none; }
        
        form { display: flex; flex-direction: column; gap: 12px; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 15px; font-size: 14px; box-sizing: border-box; }
        .submit-btn { background-color: #d63384; color: white; width: 100%; }
    </style>
</head>
<body>

    <!-- Page 1 -->
    <div class="card" id="page1">
        <h1>Hey Beautiful! ❤️</h1>
        <p>Kya aap mere saath ek perfect date par chalogi?</p>
        <div class="btn-container">
            <button class="yes-btn" onclick="nextPage()">YES! 💖</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()" onmousedown="moveButton()">NO 😜</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div class="card hidden" id="page2">
        <h1>Date Plan Karo 🌹</h1>
        <form onsubmit="sendToWhatsApp(event)">
            <input type="date" id="date" required>
            <input type="time" id="time" required>
            <input type="text" id="venue" placeholder="Venue / Kahan jana hai?" required>
            <input type="text" id="activity" placeholder="Activity / Kya karna hai?" required>
            <textarea id="msg" placeholder="Mere liye pyara sa message... ❤️" rows="3" required></textarea>
            <button type="submit" class="submit-btn">Done & Send! 💌</button>
        </form>
    </div>

    <!-- Page 3 -->
    <div class="card hidden" id="page3">
        <h1>It's a Date! 🎉</h1>
        <p style="color: #d63384; font-weight: bold;">I Love You So Much! ❤️</p>
        <p>Aapki saari details mere paas aa gayi hain!</p>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            // Button ko screen par kahin bhi bhaga do
            btn.style.position = 'fixed';
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 20);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function nextPage() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            const number = "918103503130";
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const venue = document.getElementById('venue').value;
            const activity = document.getElementById('activity').value;
            const msg = document.getElementById('msg').value;

            const text = `Hey! Date Fix ho gayi!%0A%0A📅 Date: ${date}%0A⏰ Time: ${time}%0A📍 Venue: ${venue}%0A🎯 Activity: ${activity}%0A💌 Msg: ${msg}`;
            
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.remove('hidden');
            
            window.open(`https://wa.me/${number}?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
